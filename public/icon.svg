<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f523d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06261d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Tile Gradient -->
    <linearGradient id="tile_grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="15" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gold Gradient for Crown -->
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9E7E1D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)"/>
  
  <!-- Subtle Inner Glow -->
  <rect x="10" y="10" width="492" height="492" rx="102" stroke="white" stroke-opacity="0.1" stroke-width="2" fill="none"/>

  <!-- Mahjong Tile with Shadow -->
  <g filter="url(#shadow)">
    <!-- Tile Side (3D Depth) -->
    <rect x="140" y="125" width="232" height="310" rx="20" fill="#bdbdbd"/>
    <!-- Tile Face -->
    <rect x="140" y="120" width="232" height="300" rx="20" fill="url(#tile_grad)"/>
    
    <!-- Character '中' -->
    <g transform="translate(140, 120)">
      <!-- Vertical stroke -->
      <rect x="106" y="60" width="20" height="180" rx="4" fill="#D32F2F"/>
      <!-- Outer box -->
      <path d="M50 90C50 84.4772 54.4772 80 60 80H172C177.523 80 182 84.4772 182 90V170C182 175.523 177.523 180 172 180H60C54.4772 180 50 175.523 50 170V90Z" stroke="#D32F2F" stroke-width="16" fill="none"/>
      <!-- Inner horizontal bar -->
      <rect x="58" y="122" width="116" height="16" rx="2" fill="#D32F2F"/>
    </g>
  </g>

  <!-- Premium Golden Crown -->
  <g transform="translate(256, 110) scale(1.5)" filter="url(#shadow)">
    <path d="M-30 0 L-20 -25 L0 -10 L20 -25 L30 0 Z" fill="url(#gold_grad)" stroke="#9E7E1D" stroke-width="1"/>
    <circle cx="-30" cy="0" r="3" fill="#FFD700"/>
    <circle cx="0" cy="-10" r="3" fill="#FFD700"/>
    <circle cx="30" cy="0" r="3" fill="#FFD700"/>
  </g>
</svg>
